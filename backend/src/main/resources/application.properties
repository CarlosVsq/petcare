spring.application.name=petcare

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/petcare}
spring.datasource.username=${DB_USERNAME:petcare}
spring.datasource.password=${DB_PASSWORD:petcare}

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.web.locale=es
spring.web.locale-resolver=fixed

apis.externas.url=${NODE_API_URL:http://localhost:3000}
